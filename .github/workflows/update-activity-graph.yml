name: Update GitHub profile cards

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-activity-graph.yml'
      - 'scripts/generate-activity-graph.mjs'
      - 'scripts/refresh-readme-image-urls.mjs'

permissions:
  contents: write

concurrency:
  group: profile-github-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate cards from GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: wbizmo
        run: node scripts/generate-activity-graph.mjs

      - name: Install SVG rasterizer
        run: |
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends librsvg2-bin
          fi

      - name: Post-process and rasterize cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: wbizmo
        run: node scripts/refresh-readme-image-urls.mjs

      - name: Commit refreshed cards
        run: |
          if [ -z "$(git status --porcelain -- assets/github-stats.svg assets/github-stats.png assets/github-productive-time.svg assets/github-productive-time.png assets/github-repos-language.svg assets/github-repos-language.png assets/github-streak.svg assets/github-streak.png assets/github-activity.svg assets/github-activity.png)" ]; then
            echo 'GitHub profile cards are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/github-stats.svg \
            assets/github-stats.png \
            assets/github-productive-time.svg \
            assets/github-productive-time.png \
            assets/github-repos-language.svg \
            assets/github-repos-language.png \
            assets/github-streak.svg \
            assets/github-streak.png \
            assets/github-activity.svg \
            assets/github-activity.png
          git commit -m 'chore: refresh GitHub profile cards'
          git push
