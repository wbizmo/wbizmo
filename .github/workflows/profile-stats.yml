name: Refresh private-aware profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify profile stats secret
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$PROFILE_STATS_TOKEN" ]; then
            echo "PROFILE_STATS_TOKEN is required" >&2
            exit 1
          fi

      - name: Generate private-aware profile stats
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          PROFILE_LOGIN: wbizmo
        run: node scripts/generate-private-profile-stats.mjs

      - name: Activate repository-local stats card
        run: node scripts/activate-private-profile-stats.mjs

      - name: Run profile stats tests
        run: node --test tests/profile-stats.test.mjs

      - name: Commit refreshed stats card
        run: |
          if git diff --quiet -- assets/github-stats.svg README.md; then
            echo "Profile stats already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg README.md
          git commit -m "chore: refresh private-aware profile stats"
          git push
