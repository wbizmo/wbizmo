<svg xmlns="http://www.w3.org/2000/svg" width="430" height="180" viewBox="0 0 430 180" role="img" aria-label="Repositories per language for wbizmo">

<style>
  .bg{fill:#fff}.border{fill:none;stroke:#d0d7de;stroke-width:1}
  .title{font:600 19px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;fill:#0969da}
  .label{font:400 14px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;fill:#57606a}
  .value{font:600 14px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;fill:#0969da}
  .big{font:700 31px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;fill:#0969da}
  .small{font:400 11px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;fill:#57606a}
  .sub{font:400 12px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;fill:#57606a}
  .strong{font:600 14px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;fill:#0969da}
  .grid{stroke:#d8dee4;stroke-width:1}.track{fill:#eaeef2}.mark{fill:#0969da}
  @media(prefers-color-scheme:dark){
    .bg{fill:#0d1117}.border,.grid{stroke:#30363d}.track{fill:#21262d}
    .title,.value,.big,.strong,.mark{fill:#58a6ff}.label,.small,.sub{fill:#8b949e}
  }
</style>
<rect class="bg" width="430" height="180" rx="8"/><rect class="border" x=".5" y=".5" width="429" height="179" rx="8"/>
<text class="title" x="18" y="30">Repos per Language</text><text class="sub" x="410" y="29" text-anchor="end">17 authored public repos</text>
<text class="label" x="18" y="65">TypeScript</text><rect class="track" x="145" y="55" width="220" height="11" rx="5.5"/><rect x="145" y="55" width="220.0" height="11" rx="5.5" fill="#3178c6"/><text class="value" x="405" y="65" text-anchor="end">9</text><text class="label" x="18" y="89">PHP</text><rect class="track" x="145" y="79" width="220" height="11" rx="5.5"/><rect x="145" y="79" width="73.3" height="11" rx="5.5" fill="#4F5D95"/><text class="value" x="405" y="89" text-anchor="end">3</text><text class="label" x="18" y="113">JavaScript</text><rect class="track" x="145" y="103" width="220" height="11" rx="5.5"/><rect x="145" y="103" width="48.9" height="11" rx="5.5" fill="#f1e05a"/><text class="value" x="405" y="113" text-anchor="end">2</text><text class="label" x="18" y="137">Blade</text><rect class="track" x="145" y="127" width="220" height="11" rx="5.5"/><rect x="145" y="127" width="24.4" height="11" rx="5.5" fill="#f7523f"/><text class="value" x="405" y="137" text-anchor="end">1</text><text class="label" x="18" y="161">CSS</text><rect class="track" x="145" y="151" width="220" height="11" rx="5.5"/><rect x="145" y="151" width="24.4" height="11" rx="5.5" fill="#663399"/><text class="value" x="405" y="161" text-anchor="end">1</text>
</svg>